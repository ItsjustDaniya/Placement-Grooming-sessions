name: Placement Grooming Report

on:
  schedule:
    #   03:30 UTC = 09:00 IST
    #   09:30 UTC = 15:00 IST
    #   12:30 UTC = 18:00 IST
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
        run: python scripts/placement_grooming.py
