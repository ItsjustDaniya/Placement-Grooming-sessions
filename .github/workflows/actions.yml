name: Placement Grooming Report

on:
  schedule:
    #   03:30 UTC = 09:00 IST
    #   09:30 UTC = 15:00 IST
    #   12:30 UTC = 18:00 IST
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Assignment_Pipeline_Automation.py
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
        run: python scripts/placement_grooming.py
