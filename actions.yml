name: Placement Grooming Report

on:
  schedule:
    - cron: "30 3 * * *" 
    #(03:30 UTC = 9:00 AM IST)
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
        run: python scripts/placement_grooming.py
